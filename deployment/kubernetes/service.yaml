apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-disease
  labels:
    app.kubernetes.io/name: heart-api
spec:
  # Minikube supplies the external address while `minikube tunnel` is running.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
